<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carta digital</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#17211c;--bg:#f5f6f2;--ac:#8f1d3b;--onac:#fff;--mut:#66706a;--line:#e2e5df}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif;padding-bottom:120px}
header{background:var(--ac);color:var(--onac);padding:30px 20px 26px}
header h1{margin:0;font:800 34px/1.1 Fraunces,Georgia,serif;letter-spacing:-.5px}
header p{margin:8px 0 0;opacity:.85;max-width:34ch}
.chip{display:inline-block;margin-top:14px;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.18);font-weight:600;font-size:14px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px 14px}
nav a{white-space:nowrap;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink);text-decoration:none;font-weight:600;font-size:15px}
main{max-width:640px;margin:0 auto;padding:0 14px}
h2{font:600 24px/1.2 Fraunces,Georgia,serif;margin:28px 0 10px}
.it{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.it.off{opacity:.5}.it .tx{flex:1;min-width:0}.it b{font-size:17px}
.it p{margin:3px 0 8px;color:var(--mut);font-size:14px}
.it img{width:100px;height:100px;object-fit:cover;border-radius:12px;flex:none}
.row{display:flex;justify-content:space-between;align-items:center}
.pr{font-weight:800}
.q{display:flex;align-items:center;gap:10px}
.q button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--ac);background:#fff;color:var(--ac);font-size:21px;font-weight:800;line-height:1}
.q button.pl{background:var(--ac);color:var(--onac)}
.q span{min-width:16px;text-align:center;font-weight:800}
button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 14px;display:none;z-index:6}
.bar.on{display:block}.bar>*{max-width:640px;margin-left:auto;margin-right:auto}
.send{width:100%;display:block;background:var(--ac);color:var(--onac);border:0;border-radius:14px;padding:15px;font-weight:800;font-size:18px;margin-top:8px}
input.nota{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit}
.ped{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.st{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;background:#e6e9e4;margin-left:6px}
.st.nuevo{background:#fde7c3}.st.preparando{background:#cfe9f7}.st.listo{background:#cdeedd}
.tot{display:flex;justify-content:space-between;font:800 22px Figtree;margin:14px 0}
.acc{display:flex;gap:8px}.acc button{flex:1;padding:13px;border-radius:12px;border:1.5px solid var(--ink);background:#fff;font-weight:600}
.msg{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;display:none;z-index:9}
.vac{color:var(--mut)}
</style></head><body>
<header><h1 id="nom">Carta digital</h1><p id="lema"></p><span class="chip" id="mesaTxt"></span></header>
<nav id="cats" aria-label="Categorías"></nav>
<main>
<div id="menu"><p class="vac">Cargando la carta…</p></div>
<h2>Tu cuenta</h2>
<div id="cuenta"></div>
<div class="acc"><button id="mozo">Llamar al mozo</button><button id="pedir">Pedir la cuenta</button></div>
</main>
<div class="bar" id="bar"><input class="nota" id="nota" placeholder="Aclaraciones (opcional): sin sal, bien cocida…" maxlength="120"><button class="send" id="send"></button></div>
<div class="msg" id="msg" role="status"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({databaseURL:"https://fir-pedidos-6efa9-default-rtdb.firebaseio.com",projectId:"fir-pedidos-6efa9"});
const db=firebase.database(),$=s=>document.querySelector(s);
const mesa=new URLSearchParams(location.search).get("mesa")||"1";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $$=n=>"$"+Number(n).toLocaleString("es-AR");
let menu={},cart={},pedidos={};
$("#mesaTxt").textContent="Mesa "+mesa;
db.ref("config").on("value",s=>{const c=s.val()||{};
  $("#nom").textContent=c.nombre||"Carta digital";$("#lema").textContent=c.lema||"";document.title=c.nombre||"Carta digital";
  if(/^#[0-9a-f]{6}$/i.test(c.color||"")){const n=parseInt(c.color.slice(1),16),l=(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255,r=document.documentElement.style;
    r.setProperty("--ac",c.color);r.setProperty("--onac",l>.62?"#17211c":"#fff")}});
db.ref("menu").on("value",s=>{menu=s.val()||{};drawMenu()});
db.ref("pedidos").on("value",s=>{pedidos=s.val()||{};drawCuenta()});
function drawMenu(){
  const ids=Object.keys(menu);
  if(!ids.length){$("#menu").innerHTML='<p class="vac">La carta todavía no está cargada.</p>';$("#cats").innerHTML="";return}
  const cats={};ids.forEach(id=>(cats[menu[id].categoria||"Otros"]??=[]).push(id));
  $("#cats").innerHTML=Object.keys(cats).map((c,i)=>`<a href="#c${i}">${esc(c)}</a>`).join("");
  $("#menu").innerHTML=Object.entries(cats).map(([c,l],i)=>`<h2 id="c${i}">${esc(c)}</h2>`+l.map(id=>{
    const m=menu[id],off=m.disponible===false;
    return `<div class="it ${off?"off":""}"><div class="tx"><b>${esc(m.nombre)}</b>${m.desc?`<p>${esc(m.desc)}</p>`:"<p></p>"}
    <div class="row"><span class="pr">${$$(m.precio)}</span>${off?'<small class="vac">Sin stock</small>':`<div class="q"><button data-m="${id}" aria-label="Quitar ${esc(m.nombre)}">−</button><span>${cart[id]||0}</span><button class="pl" data-p="${id}" aria-label="Agregar ${esc(m.nombre)}">+</button></div>`}</div></div>
    ${m.foto?`<img src="${esc(m.foto)}" alt="${esc(m.nombre)}" loading="lazy">`:""}</div>`}).join("")).join("");
  drawBar();
}
$("#menu").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const p=b.dataset.p,m=b.dataset.m,y=scrollY;
  if(p)cart[p]=(cart[p]||0)+1;if(m&&cart[m])cart[m]--;
  if(p||m){drawMenu();scrollTo(0,y)}
});
function drawBar(){
  const ids=Object.keys(cart).filter(i=>cart[i]>0&&menu[i]);
  const n=ids.reduce((a,i)=>a+cart[i],0),t=ids.reduce((a,i)=>a+cart[i]*menu[i].precio,0);
  $("#bar").classList.toggle("on",n>0);$("#send").textContent=`Enviar pedido (${n}) · ${$$(t)}`;
}
$("#send").onclick=()=>{
  const items=Object.keys(cart).filter(i=>cart[i]>0&&menu[i]).map(i=>({id:i,nombre:menu[i].nombre,precio:menu[i].precio,cant:cart[i]}));
  if(!items.length)return;
  const total=items.reduce((a,i)=>a+i.precio*i.cant,0);
  db.ref("pedidos").push({mesa,items,total,nota:$("#nota").value.trim(),estado:"nuevo",cerrado:false,ts:firebase.database.ServerValue.TIMESTAMP})
   .then(()=>{cart={};$("#nota").value="";drawMenu();aviso("Pedido enviado a la cocina")})
   .catch(()=>aviso("No se pudo enviar. Revisá tu conexión e intentá de nuevo."));
};
function drawCuenta(){
  const mine=Object.values(pedidos).filter(p=>p.mesa==mesa&&!p.cerrado).sort((a,b)=>a.ts-b.ts);
  if(!mine.length){$("#cuenta").innerHTML='<p class="vac">Todavía no pediste nada.</p>';return}
  const t=mine.reduce((a,p)=>a+p.total,0);
  $("#cuenta").innerHTML=mine.map((p,i)=>`<div class="ped"><b>Pedido ${i+1}</b><span class="st ${p.estado}">${esc(p.estado)}</span>
  ${p.items.map(x=>`<div class="row"><span>${x.cant} × ${esc(x.nombre)}</span><span>${$$(x.cant*x.precio)}</span></div>`).join("")}</div>`).join("")
  +`<div class="tot"><span>Total</span><span>${$$(t)}</span></div>`;
}
function llamar(tipo,txt){db.ref("llamados").push({mesa,tipo,atendido:false,ts:firebase.database.ServerValue.TIMESTAMP}).then(()=>aviso(txt))}
$("#mozo").onclick=()=>llamar("mozo","Avisamos al mozo");
$("#pedir").onclick=()=>llamar("cuenta","Pedimos tu cuenta");
function aviso(t){const m=$("#msg");m.textContent=t;m.style.display="block";setTimeout(()=>m.style.display="none",2500)}
</script></body></html>
