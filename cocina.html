<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel de cocina</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#17211c;--bg:#f5f6f2;--ac:#8f1d3b;--onac:#fff;--mut:#66706a;--line:#e2e5df}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif}
header{background:var(--ac);color:var(--onac);padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header h1{margin:0;font:800 24px Fraunces,Georgia,serif;flex:1}
button,input,textarea{font:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.b{border:0;border-radius:10px;padding:10px 15px;font-weight:600;background:var(--ac);color:var(--onac)}
.b.g{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}.b.r{background:#b42318;color:#fff}
nav{display:flex;gap:6px;padding:14px 14px 0;max-width:1040px;margin:0 auto}
nav button{padding:10px 18px;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;background:#e9ece6;font-weight:600}
nav button.on{background:#fff}
main{max-width:1040px;margin:0 auto;padding:16px;background:#fff;min-height:70vh;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{border:2px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.card.nuevo{border-color:#f59e0b;background:#fff8e8}.card.preparando{border-color:#38a3d8}.card.listo{border-color:#22a06b}
.card h3{margin:0 0 4px;font:800 24px Fraunces,Georgia,serif}.card small,.vac{color:var(--mut)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:6px 0}
.call{background:#fde7c3;border:2px solid #f59e0b;border-radius:12px;padding:10px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.dish{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0;flex-wrap:wrap}
.dish .th{width:64px;height:64px;border-radius:10px;object-fit:cover;background:#e9ece6;flex:none}
.dish .in{flex:1;min-width:140px}
.dish.off .in{opacity:.5}
dialog{border:0;border-radius:18px;padding:22px;width:min(480px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(23,33,28,.55)}
label{display:block;font-weight:600;margin:10px 0 0;font-size:15px}
label input:not([type=checkbox]),label textarea{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:10px;font-weight:400}
#prev img{width:120px;height:120px;object-fit:cover;border-radius:12px;margin-top:8px;display:block}
.acts{display:flex;gap:8px;margin-top:16px}
#ticket{display:none}
@media print{body>*:not(#ticket){display:none!important}#ticket{display:block;width:72mm;font:14px/1.3 monospace;color:#000}#ticket hr{border:0;border-top:1px dashed #000}}
</style></head><body>
<header><h1 id="nom">Panel de cocina</h1><button class="b g" id="snd">Activar sonido</button></header>
<nav><button data-t="ped" class="on">Pedidos</button><button data-t="mes">Mesas y cuentas</button><button data-t="car">Carta</button><button data-t="aj">Mi local</button></nav>
<main id="main"></main>
<dialog id="dlg"><h3 id="dt" style="margin:0;font:800 22px Fraunces,Georgia,serif"></h3>
<label>Nombre del plato<input id="f_n" maxlength="60"></label>
<label>Categoría<input id="f_c" list="cl" maxlength="30" placeholder="Ej. Entradas, Postres"></label><datalist id="cl"></datalist>
<label>Precio<input id="f_p" type="number" min="0"></label>
<label>Descripción<textarea id="f_d" rows="2" maxlength="140"></textarea></label>
<label>Foto<input id="f_f" type="file" accept="image/*"></label>
<div id="prev"></div><button type="button" class="b g" id="quitar" style="margin-top:8px;display:none">Quitar foto</button>
<label><input id="f_a" type="checkbox"> Disponible (hay stock)</label>
<div class="acts"><button type="button" class="b" id="gd">Guardar</button><button type="button" class="b g" id="cn">Cancelar</button></div></dialog>
<div id="ticket"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({databaseURL:"https://fir-pedidos-6efa9-default-rtdb.firebaseio.com",projectId:"fir-pedidos-6efa9"});
const db=firebase.database(),$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $$=n=>"$"+Number(n).toLocaleString("es-AR");
const hora=t=>t?new Date(t).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}):"";
const hace=t=>{const m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?"recién":"hace "+m+" min"};
let tab="ped",menu={},pedidos={},llamados={},cfg={},ctx=null,seen=null,seenL=null,editId=null,foto="";
const SIG={nuevo:["preparando","Empezar a preparar"],preparando:["listo","Marcar listo"],listo:["entregado","Marcar entregado"]};
const SEED=[["Entradas","Empanadas de carne (x3)",6500,"Con salsa criolla"],["Entradas","Provoleta",7800,"A la parrilla"],["Principales","Milanesa napolitana",14500,"Con papas fritas"],["Principales","Pizza muzzarella",12000,"Grande, 8 porciones"],["Bebidas","Gaseosa 500 ml",3200,""],["Bebidas","Cerveza artesanal",5200,"Pinta"],["Postres","Flan con dulce de leche",5500,""]];
$("#snd").onclick=()=>{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();beep();$("#snd").textContent="Sonido activado"};
function beep(){if(!ctx)return;[0,.22].forEach(d=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+.15)})}
document.querySelector("nav").onclick=e=>{if(!e.target.dataset.t)return;tab=e.target.dataset.t;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b===e.target));draw(true)};
db.ref("config").on("value",s=>{cfg=s.val()||{};$("#nom").textContent=cfg.nombre?cfg.nombre+" · Cocina":"Panel de cocina";
  if(/^#[0-9a-f]{6}$/i.test(cfg.color||"")){const n=parseInt(cfg.color.slice(1),16),l=(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255))/255,r=document.documentElement.style;r.setProperty("--ac",cfg.color);r.setProperty("--onac",l>.62?"#17211c":"#fff")}
  draw()});
db.ref("menu").on("value",s=>{menu=s.val()||{};draw()});
db.ref("pedidos").on("value",s=>{pedidos=s.val()||{};const ids=Object.keys(pedidos);
  if(seen&&ids.some(i=>!seen.has(i)&&pedidos[i].estado==="nuevo"))beep();seen=new Set(ids);draw()});
db.ref("llamados").on("value",s=>{llamados=s.val()||{};const ids=Object.keys(llamados);
  if(seenL&&ids.some(i=>!seenL.has(i)))beep();seenL=new Set(ids);draw()});
setInterval(()=>{if(tab==="ped")draw()},30000);
function draw(force){
  const a=document.activeElement;
  if(!force&&a&&$("#main").contains(a)&&/INPUT|TEXTAREA/.test(a.tagName))return;
  $("#main").innerHTML=tab==="ped"?vPed():tab==="mes"?vMes():tab==="car"?vCar():vAj();
}
function vPed(){
  const ll=Object.entries(llamados).filter(([,l])=>!l.atendido).sort((a,b)=>a[1].ts-b[1].ts)
   .map(([id,l])=>`<div class="call"><b>Mesa ${esc(l.mesa)}: ${l.tipo==="cuenta"?"pide la cuenta":"llama al mozo"}</b><button class="b" onclick="db.ref('llamados/${id}/atendido').set(true)">Atendido</button></div>`).join("");
  const act=Object.entries(pedidos).filter(([,p])=>!p.cerrado&&p.estado!=="entregado").sort((a,b)=>a[1].ts-b[1].ts);
  return ll+(act.length?`<div class="grid">`+act.map(([id,p])=>`<div class="card ${p.estado}"><h3>Mesa ${esc(p.mesa)}</h3><small>${hora(p.ts)} · ${hace(p.ts)} · ${esc(p.estado)}</small>
   ${p.items.map(x=>`<div class="row"><span>${x.cant} × ${esc(x.nombre)}</span></div>`).join("")}
   ${p.nota?`<p><b>Nota:</b> ${esc(p.nota)}</p>`:""}
   <button class="b" style="width:100%" onclick="db.ref('pedidos/${id}/estado').set('${SIG[p.estado][0]}')">${SIG[p.estado][1]}</button></div>`).join("")+`</div>`:`<p class="vac">No hay pedidos pendientes. Los nuevos aparecen acá con sonido.</p>`);
}
function vMes(){
  const by={};Object.entries(pedidos).filter(([,p])=>!p.cerrado).forEach(([id,p])=>(by[p.mesa]??=[]).push([id,p]));
  const ms=Object.keys(by);if(!ms.length)return `<p class="vac">No hay mesas con cuenta abierta.</p>`;
  return `<div class="grid">`+ms.map(m=>{const t=by[m].reduce((a,[,p])=>a+p.total,0);
   return `<div class="card"><h3>Mesa ${esc(m)}</h3><small>${by[m].length} pedido(s)</small><div class="row"><b>Total</b><b>${$$(t)}</b></div>
   <button class="b" style="width:100%" onclick="cerrar(this.dataset.m)" data-m="${esc(m)}">Imprimir y cerrar mesa</button></div>`}).join("")+`</div>`;
}
function cerrar(m){
  const l=Object.entries(pedidos).filter(([,p])=>!p.cerrado&&p.mesa==m);
  const agg={};l.forEach(([,p])=>p.items.forEach(x=>{const k=x.nombre+"|"+x.precio;agg[k]=agg[k]||{...x,cant:0};agg[k].cant+=x.cant}));
  const t=l.reduce((a,[,p])=>a+p.total,0);
  $("#ticket").innerHTML=`<b>${esc(cfg.nombre||"Cuenta")}</b><br>CUENTA · MESA ${esc(m)}<br>${new Date().toLocaleString("es-AR")}<hr>`
   +Object.values(agg).map(x=>`${x.cant} × ${esc(x.nombre)}<br>&nbsp;&nbsp;&nbsp;${$$(x.cant*x.precio)}<br>`).join("")+`<hr><b>TOTAL ${$$(t)}</b><br>¡Gracias por tu visita!`;
  window.print();
  if(confirm("¿Se imprimió bien? Si aceptás, se cierra la mesa "+m+"."))l.forEach(([id])=>db.ref("pedidos/"+id+"/cerrado").set(true));
}
function vCar(){
  const ids=Object.keys(menu);
  return `<div class="row"><h3 style="margin:0">Carta (${ids.length} platos)</h3><span><button class="b" onclick="abrir()">+ Agregar plato</button>${ids.length?"":` <button class="b g" onclick="seed()">Cargar ejemplo</button>`}</span></div>`
  +(ids.length?"":`<p class="vac">La carta está vacía. Agregá tu primer plato o cargá la carta de ejemplo.</p>`)
  +ids.map(id=>{const m=menu[id],off=m.disponible===false;
   return `<div class="dish ${off?"off":""}">${m.foto?`<img class="th" src="${esc(m.foto)}" alt="">`:`<div class="th"></div>`}
   <div class="in"><b>${esc(m.nombre)}</b><br><small>${esc(m.categoria||"Otros")} · ${$$(m.precio)}${off?" · Sin stock":""}</small></div>
   <button class="b g" onclick="db.ref('menu/${id}/disponible').set(${off})">${off?"Reponer":"Sin stock"}</button>
   <button class="b" onclick="abrir('${id}')">Editar</button>
   <button class="b g" onclick="borrar('${id}')">Borrar</button></div>`}).join("");
}
function abrir(id){
  editId=id||null;const m=id?menu[id]:{};foto=m.foto||"";
  $("#dt").textContent=id?"Editar plato":"Nuevo plato";
  $("#f_n").value=m.nombre||"";$("#f_c").value=m.categoria||"";$("#f_p").value=m.precio??"";$("#f_d").value=m.desc||"";$("#f_a").checked=m.disponible!==false;$("#f_f").value="";
  $("#cl").innerHTML=[...new Set(Object.values(menu).map(x=>x.categoria).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join("");
  prev();$("#dlg").showModal();
}
function prev(){$("#prev").innerHTML=foto?`<img src="${esc(foto)}" alt="Vista previa">`:"";$("#quitar").style.display=foto?"inline-block":"none"}
$("#quitar").onclick=()=>{foto="";$("#f_f").value="";prev()};
$("#cn").onclick=()=>$("#dlg").close();
$("#f_f").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,640/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);foto=c.toDataURL("image/jpeg",.72);prev()};i.src=r.result};r.readAsDataURL(f)};
$("#gd").onclick=()=>{
  const n=$("#f_n").value.trim(),p=Number($("#f_p").value);
  if(!n||!(p>=0)||$("#f_p").value===""){alert("Completá el nombre y el precio del plato.");return}
  const o={nombre:n,categoria:$("#f_c").value.trim()||"Otros",precio:p,desc:$("#f_d").value.trim(),foto,disponible:$("#f_a").checked};
  (editId?db.ref("menu/"+editId).update(o):db.ref("menu").push(o)).then(()=>$("#dlg").close()).catch(()=>alert("No se pudo guardar. Revisá tu conexión."));
};
function borrar(id){if(confirm("¿Borrar \""+menu[id].nombre+"\" de la carta?"))db.ref("menu/"+id).remove()}
function seed(){SEED.forEach(([c,n,p,d])=>db.ref("menu").push({categoria:c,nombre:n,precio:p,desc:d,foto:"",disponible:true}))}
function vAj(){
  return `<h3 style="margin-top:0">Datos de tu local</h3><p class="vac">Esto es lo que ven tus clientes arriba de la carta.</p>
  <label>Nombre del local<input id="a_n" value="${esc(cfg.nombre||"")}" maxlength="40"></label>
  <label>Frase corta<input id="a_l" value="${esc(cfg.lema||"")}" maxlength="70" placeholder="Ej. Cocina casera desde 1998"></label>
  <label>Color de la marca<input id="a_c" type="color" value="${/^#[0-9a-f]{6}$/i.test(cfg.color||"")?cfg.color:"#8f1d3b"}" style="height:46px;padding:4px"></label>
  <div class="acts"><button class="b" onclick="guardarAj()">Guardar cambios</button></div>
  <p class="vac" style="margin-top:24px">Cada mesa usa su propio link: <b>tu-sitio/?mesa=1</b>, <b>?mesa=2</b> y así.</p>`;
}
function guardarAj(){db.ref("config").set({nombre:$("#a_n").value.trim(),lema:$("#a_l").value.trim(),color:$("#a_c").value}).then(()=>alert("Cambios guardados"))}
</script></body></html>
